name: Оценка сайтов Lighthouse

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitoring-data
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Измерить скорость и доступность
        run: |
          # Chrome из образа Ubuntu использует системный профиль песочницы.
          export CHROME_PATH="$(command -v google-chrome)"
          test -x "$CHROME_PATH"
          npm run audit:sites
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: public/data/audits.json
          if-no-files-found: error
          retention-days: 1
  record:
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-results
          path: public/data
      - name: Записать оценки в main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/audits.json
          git commit -m 'monitoring: оценки Lighthouse'
          git push origin HEAD:main
  publish:
    needs: record
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
